name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: weiseratel
          base: header, activity, community, repositories
          base_indepth: yes
          repositories_affiliations: owner
          commits_authoring: >-
            weiseratel, Josué V. Herrera, josh@ratelbau.com, vladernu@gmail.com, 109978789+weiseratel@users.noreply.github.com
          filename: stats.svg
          config_timezone: Europe/Madrid

  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Test git clone with token
        run: |
          echo "Testing git clone with METRICS_TOKEN..."
          git clone --depth=1 https://x-access-token:${{ secrets.METRICS_TOKEN }}@github.com/Ticketeame/backend.git /tmp/test-backend && echo "backend: OK" || echo "backend: FAILED"
          rm -rf /tmp/test-backend
          git clone --depth=1 https://x-access-token:${{ secrets.METRICS_TOKEN }}@github.com/weiseratel/sysctl.git /tmp/test-sysctl && echo "sysctl: OK" || echo "sysctl: FAILED"
          rm -rf /tmp/test-sysctl
      - uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: weiseratel
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: Ticketeame/backend, Ticketeame/Infrastructure, weiseratel/sysctl, weiseratel/yumrepomanager
          plugin_languages_limit: 8
          plugin_languages_threshold: "2%"
          plugin_languages_ignored: html, css, json, markdown, dockerfile, yaml, toml, ini, mako
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_analysis_timeout: 120
          plugin_languages_analysis_timeout_repositories: 60
          repositories_affiliations: owner, collaborator, organization_member
          commits_authoring: >-
            weiseratel, Josué V. Herrera, josh@ratelbau.com, vladernu@gmail.com, 109978789+weiseratel@users.noreply.github.com
          filename: languages.svg
          config_timezone: Europe/Madrid
          debug: yes
