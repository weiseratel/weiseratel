name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: weiseratel
          base: header, activity, community, repositories
          base_indepth: yes
          repositories_affiliations: owner
          commits_authoring: >-
            weiseratel, Josué V. Herrera, josh@ratelbau.com, vladernu@gmail.com, 109978789+weiseratel@users.noreply.github.com
          filename: stats.svg
          config_timezone: Europe/Madrid

  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Ticketeame/backend
          token: ${{ secrets.METRICS_TOKEN }}
          path: .repos/backend
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Ticketeame/Infrastructure
          token: ${{ secrets.METRICS_TOKEN }}
          path: .repos/infrastructure
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: weiseratel/sysctl
          token: ${{ secrets.METRICS_TOKEN }}
          path: .repos/sysctl
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: weiseratel/yumrepomanager
          token: ${{ secrets.METRICS_TOKEN }}
          path: .repos/yumrepomanager
          fetch-depth: 0

      - name: Analyze languages and generate SVG
        shell: bash
        run: |
          python3 -c "
          import subprocess, os, sys
          from collections import defaultdict
          from pathlib import Path

          AP = 'weiseratel\|josh@ratelbau.com\|vladernu@gmail.com'
          AP += '\|109978789+weiseratel@users.noreply.github.com'

          EXT = {
            '.py':'Python','.pyx':'Python','.pyi':'Python',
            '.cpp':'C++','.cc':'C++','.cxx':'C++','.c':'C',
            '.h':'C++','.hpp':'C++',
            '.sh':'Shell','.bash':'Shell','.zsh':'Shell',
            '.sql':'SQL','.hcl':'HCL','.tf':'HCL',
            '.nix':'Nix','.pro':'QMake','.pri':'QMake',
          }

          SKIP = {'.html','.css','.json','.md','.yml','.yaml',
            '.toml','.ini','.mako','.txt','.cfg','.conf',
            '.env','.gitignore','.lock','.svg','.png','.jpg',
            '.gif','.ico','.woff','.woff2','.eot','.ttf',
            '.map','.pyc','.pyo','.dockerfile','.dockerignore',
            '.editorconfig','.in','.rst','.csv','.xml','.xsd'}

          COLORS = {
            'Python':'#3572A5','C++':'#f34b7d','C':'#555555',
            'Shell':'#89e051','SQL':'#e38c00','HCL':'#844fba',
            'Nix':'#7e7eff','QMake':'#0064b8',
          }

          REPOS = ['.repos/backend','.repos/infrastructure','.repos/sysctl','.repos/yumrepomanager']
          lang_lines = defaultdict(int)
          total_commits = 0
          total_files = set()

          for rp in REPOS:
            if not os.path.isdir(rp):
              print(f'Skip {rp}'); continue
            r = subprocess.run(
              ['git','log','--all',f'--author={AP}','--numstat','--pretty=format:%H'],
              cwd=rp, capture_output=True, text=True, timeout=120)
            seen = set()
            for line in r.stdout.strip().split('\n'):
              line = line.strip()
              if not line: continue
              parts = line.split('\t')
              if len(parts)==1 and len(parts[0])==40:
                seen.add(parts[0]); continue
              if len(parts)!=3: continue
              a,d,fp = parts
              if a=='-': continue
              ext = Path(fp).suffix.lower()
              if ext in SKIP or not ext: continue
              lang = EXT.get(ext)
              if not lang: continue
              lang_lines[lang] += int(a)
              total_files.add(f'{rp}/{fp}')
            total_commits += len(seen)
            print(f'{rp}: {len(seen)} commits')

          if not lang_lines:
            print('No data!'); sys.exit(1)

          sl = sorted(lang_lines.items(), key=lambda x:-x[1])
          total = sum(v for _,v in sl)
          sl = [(k,v) for k,v in sl if v/total>=0.02][:8]
          total = sum(v for _,v in sl)

          print(f'Total: {total_commits} commits, {len(total_files)} files')
          for l,n in sl: print(f'  {l}: {n:,} ({n/total*100:.1f}%)')

          BW = 460
          rows = (len(sl)+1)//2
          sh = 58 + rows*22 + 20

          S = []
          S.append(f'<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"{sh}\">')
          S.append('<style>svg{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;font-size:14px;color:#777}</style>')
          S.append('<foreignObject x=\"0\" y=\"0\" width=\"100%\" height=\"100%\">')
          S.append('<div xmlns=\"http://www.w3.org/1999/xhtml\">')
          S.append('<section style=\"display:flex;flex-direction:column;align-items:center\">')
          S.append('<h3 style=\"margin:8px 0 2px;color:#0366d6;font-weight:400;font-size:14px\">Most used languages</h3>')
          S.append(f'<small style=\"color:#777\">estimation from {total_commits} commits across {len(REPOS)} repositories</small>')
          S.append(f'<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"{BW}\" height=\"8\" style=\"margin:4px 0\">')
          S.append(f'<mask id=\"bar\"><rect x=\"0\" y=\"0\" width=\"{BW}\" height=\"8\" fill=\"white\" rx=\"5\"/></mask>')
          S.append(f'<rect mask=\"url(#bar)\" x=\"0\" y=\"0\" width=\"{BW}\" height=\"8\" fill=\"#d1d5da\"/>')
          xo = 0
          for l,n in sl:
            w = max(round(BW*n/total),1); c = COLORS.get(l,'#959da5')
            S.append(f'<rect mask=\"url(#bar)\" x=\"{xo}\" y=\"0\" width=\"{w}\" height=\"8\" fill=\"{c}\"/>')
            xo += w
          S.append('</svg>')
          S.append('<div style=\"display:flex;width:100%\">')
          left = []; right = []
          for i,(l,n) in enumerate(sl):
            p = n/total*100; c = COLORS.get(l,'#959da5')
            if n>=1000000: sz=f'{n/1000000:.2f} MB'
            elif n>=1000: sz=f'{n/1000:.1f} kB'
            else: sz=f'{n} B'
            e = f'<div style=\"display:flex;align-items:center;margin:0 8px 2px;white-space:nowrap;justify-content:space-between\">'
            e += f'<div style=\"display:flex;align-items:center\">'
            e += f'<svg viewBox=\"0 0 16 16\" width=\"16\" height=\"16\" style=\"margin:0 8px;flex-shrink:0\"><circle cx=\"8\" cy=\"8\" r=\"4\" fill=\"{c}\"/></svg>'
            e += f'<span>{l}</span></div>'
            e += f'<small style=\"color:#666;display:flex;gap:6px\"><span>{sz}</span><span>{p:.1f}%</span></small>'
            e += '</div>'
            if i%2==0: left.append(e)
            else: right.append(e)
          S.append('<section style=\"flex:1 1 0\">' + ''.join(left) + '</section>')
          S.append('<section style=\"flex:1 1 0\">' + ''.join(right) + '</section>')
          S.append('</div></section></div>')
          S.append('<div xmlns=\"http://www.w3.org/1999/xhtml\" id=\"metrics-end\"></div>')
          S.append('</foreignObject></svg>')

          with open('languages.svg','w') as f: f.write('\n'.join(S))
          print(f'Generated languages.svg ({sh}px, {len(sl)} langs)')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --staged --quiet || (git commit -m "chore: update languages" && git push)
